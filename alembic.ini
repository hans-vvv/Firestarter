# Alembic configuration for the Firestarter database.
#
# The database URL is resolved at runtime in ``migrations/env.py`` via
# ``app.config.get_database_url()`` (which honours ``DATABASE_URL`` and otherwise
# defaults to the repo-root ``app.db``), so the ``sqlalchemy.url`` below is only
# a placeholder and is intentionally overridden. Do not rely on it.

[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.18+: make list-splitting explicit (silences the legacy-split warning).
path_separator = os
# Overridden in env.py — kept non-empty so Alembic's config parser is happy.
sqlalchemy.url = sqlite:///app.db

[post_write_hooks]
# Run ruff over freshly generated migration files so they match project style.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
