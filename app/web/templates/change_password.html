{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="page-title h4 mb-2 text-center">Choose a new password</h1>
        {% if current_user and current_user.must_change_password %}
        <p class="text-muted text-center small mb-4">
          You must set a new password before continuing.
        </p>
        {% endif %}

        <form method="post" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label for="new_password" class="form-label">New password</label>
            <input type="password" class="form-control" id="new_password" name="new_password"
                   autocomplete="new-password" minlength="8" autofocus required>
            <div class="form-text">At least 8 characters.</div>
          </div>

          <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm new password</label>
            <input type="password" class="form-control" id="confirm_password"
                   name="confirm_password" autocomplete="new-password" minlength="8" required>
          </div>

          <button type="submit" class="btn btn-firestarter rounded-pill w-100">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
