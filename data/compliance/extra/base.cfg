# base.cfg — config every device must carry that the renderer does not produce.
# The local admin user is deliberately not modelled; its password hash is
# redacted on both sides (see ignore/base.yaml), so only its presence is checked.
configure system security user-params local-user user "admin" access console true
configure system security user-params local-user user "admin" console member ["administrative"]
configure system security user-params local-user user "admin" password <redacted>
configure system security user-params local-user user "admin" restricted-to-home false
