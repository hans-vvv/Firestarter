# Build, test and publish the demo image to GitHub Container Registry.
#
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand from the Actions tab ("Run workflow").
# Result: ghcr.io/<owner>/firestarter:<version> and :latest
name: Publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run the test suite inside the image (test stage)
        run: |
          docker build --target test -t firestarter-test .
          docker run --rm firestarter-test

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/firestarter
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
