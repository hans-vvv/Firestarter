{% extends "base.html" %}
{% block title %}Overview{% endblock %}

{% block content %}
<h1 class="page-title">Overview</h1>

<div class="row g-3 mb-4">

  <div class="col-sm-6 col-xl-3">
    <div class="card summary-card h-100 p-3">
      <div class="card-title">Devices</div>
      <div class="card-value">{{ device_count }}</div>
    </div>
  </div>

  <div class="col-sm-6 col-xl-3">
    <div class="card summary-card h-100 p-3">
      <div class="card-title">Total Jobs</div>
      <div class="card-value">{{ job_count }}</div>
    </div>
  </div>

  <div class="col-sm-6 col-xl-3">
    <div class="card summary-card h-100 p-3">
      <div class="card-title">Completed Jobs</div>
      <div class="card-value text-success">{{ completed_jobs }}</div>
    </div>
  </div>

  <div class="col-sm-6 col-xl-3">
    <div class="card summary-card h-100 p-3">
      <div class="card-title">Pending Jobs</div>
      <div class="card-value" style="color: var(--fs-red)">{{ pending_jobs }}</div>
    </div>
  </div>

</div>

<div class="row g-3">
  <div class="col-md-6">
    <div class="card summary-card p-3">
      <div class="card-title mb-2">Quick links</div>
      <div class="d-flex flex-column gap-2">
        <a href="{{ url_for('devices.index') }}" class="btn btn-outline-secondary btn-sm text-start">
          <i class="bi bi-hdd-rack me-2"></i>View all devices
        </a>
        <a href="{{ url_for('compliance.index') }}" class="btn btn-outline-secondary btn-sm text-start">
          <i class="bi bi-shield-check me-2"></i>Run compliance check
        </a>
        <a href="{{ url_for('jobs.index') }}" class="btn btn-outline-secondary btn-sm text-start">
          <i class="bi bi-list-check me-2"></i>View jobs
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
